<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Bulk | サポート</title>
  <meta name="description" content="Bulk Bulk のサポートページです。お問い合わせ先を掲載しています。">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --subtle: #cbd5e1;
      --accent: #22c55e;
      --line: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #020617 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .container {
      width: min(760px, 100%);
      background: color-mix(in srgb, var(--card) 92%, black 8%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.2;
    }
    p {
      margin: 0 0 12px;
      line-height: 1.7;
      color: var(--subtle);
    }
    .mail {
      display: inline-block;
      margin: 8px 0 16px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.14);
      color: #bbf7d0;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid rgba(34, 197, 94, 0.35);
      word-break: break-all;
    }
    .mail:hover { opacity: 0.9; }
    .note {
      font-size: 14px;
      color: #94a3b8;
      border-top: 1px solid var(--line);
      margin-top: 18px;
      padding-top: 14px;
    }
    ul {
      margin: 0 0 12px 20px;
      padding: 0;
      color: var(--subtle);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Bulk Bulk サポート</h1>
    <p>
      Bulk Bulk に関するお問い合わせは、以下のメールアドレスまでご連絡ください。
    </p>
    <a class="mail" href="mailto:velastudio.dev@gmail.com">velastudio.dev@gmail.com</a>

    <p>お問い合わせ時は、以下をご記載いただくと確認がスムーズです。</p>
    <ul>
      <li>ご利用端末（例: iPhone 15 / iOS 18）</li>
      <li>アプリのバージョン</li>
      <li>お問い合わせ内容（発生手順・スクリーンショットなど）</li>
    </ul>

    <p class="note">
      運営: Vela Studio |
      <a href="./privacy.html">プライバシーポリシー</a>
    </p>
  </main>
</body>
</html>
